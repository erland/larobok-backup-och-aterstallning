name: Build Preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"
      - name: Install XeLaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern fonts-texgyre poppler-utils
          fc-cache -f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML PyMuPDF
      - name: Build preview and validate exports
        run: python scripts/build_book.py
      - uses: actions/upload-artifact@v4
        with:
          name: book-preview
          path: |
            exports/*.epub
            exports/*.pdf
            exports/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
