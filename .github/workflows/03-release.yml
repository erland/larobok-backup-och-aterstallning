name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"
      - name: Install XeLaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern fonts-texgyre poppler-utils
          fc-cache -f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML PyMuPDF
      - name: Validate SemVer release tag
        env:
          BOOK_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$BOOK_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Taggen måste vara v<SemVer>'; exit 1; }
      - name: Build release using tag version
        env:
          BOOK_RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_book.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" exports/*.epub exports/*.pdf exports/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" exports/*.epub exports/*.pdf exports/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes
          fi
